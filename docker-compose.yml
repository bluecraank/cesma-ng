name: cesma

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cesma
      POSTGRES_USER: cesma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cesma -d cesma"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      CESMA_DATABASE_URL: postgresql+asyncpg://cesma:${POSTGRES_PASSWORD}@db:5432/cesma
    depends_on:
      db:
        condition: service_healthy

  # Polls the switches, runs backups, VLAN sync and the other background jobs.
  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      CESMA_DATABASE_URL: postgresql+asyncpg://cesma:${POSTGRES_PASSWORD}@db:5432/cesma
      CESMA_RUN_MIGRATIONS: "false"
    command: ["cesma-worker"]
    depends_on:
      api:
        condition: service_started  # the api container runs the database migrations

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "${CESMA_HTTP_PORT:-80}:80"
      - "${CESMA_HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - api

volumes:
  db-data:
  caddy-data:
