[project]
name = "cesma-ng"
version = "0.14.1"
description = "Cesma NG - switch management for Dell N1500, Dell OS10 and HP/Aruba 2530"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "ldap3>=2.9",
    "cryptography>=43",
    "pysnmp>=7.1",
    "httpx>=0.27",
    "asyncssh>=2.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

legacy = ["pymysql>=1.1"]  # cesma import-legacy (data from cesma-on-premise)

[project.scripts]
cesma = "app.cli:main"
cesma-worker = "app.jobs.worker:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["ldap3.*", "pysnmp.*", "asyncssh.*"]
ignore_missing_imports = true
